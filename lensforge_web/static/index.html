<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LensForge</title>
<meta name="description" content="LensForge: sequential optical design in the browser - lens data editor, analyses, optimisation and tolerancing.">
<link rel="icon" type="image/svg+xml" href="app-icon.svg">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script>
  // Cross-origin isolation (needed for the Stop button of long runs): hosts that cannot send the
  // COOP/COEP headers get them from a service worker (sw.js), after one reload.
  (function () {
    if (self.crossOriginIsolated || !window.isSecureContext || !("serviceWorker" in navigator)) return;
    let tried = false;
    try { tried = sessionStorage.getItem("lf-coi-reload") === "1"; } catch (e) {}
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      if (tried) return;  // the worker is in place but the page is still not isolated: carry on without
      function reload() { try { sessionStorage.setItem("lf-coi-reload", "1"); } catch (e) {} location.reload(); }
      if (navigator.serviceWorker.controller) reload();
      else navigator.serviceWorker.addEventListener("controllerchange", reload);
    }).catch(function () {});
  })();
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <nav id="menubar" role="menubar" aria-label="Main menu"></nav>
  <div id="toolbar" role="toolbar" aria-label="Toolbar" hidden></div>
  <div id="workspace">
    <aside id="left-dock" class="dock" hidden></aside>
    <div id="split-left" class="splitter vertical" hidden></div>
    <main id="center">
      <section class="dock-panel" id="lde-panel">
        <div id="lde" tabindex="0" aria-label="Lens Data Editor"></div>
      </section>
    </main>
    <div id="split-right" class="splitter vertical" hidden></div>
    <aside id="right-dock" class="dock" hidden></aside>
  </div>
  <div id="split-bottom" class="splitter horizontal" hidden></div>
  <section id="bottom-dock" class="dock" hidden></section>
  <footer id="statusbar">
    <span id="status-msg"></span>
    <span id="status-config"></span>
    <span id="status-lens"></span>
    <span id="status-merit"></span>
  </footer>
</div>
<div id="floating-layer"></div>
<div id="modal-layer"></div>
<div id="splash">
  <div class="splash-box">
    <img src="app-icon.svg" alt="" width="96" height="96">
    <h1>LensForge</h1>
    <p id="splash-msg">Starting...</p>
    <div class="splash-bar"><div id="splash-progress"></div></div>
    <p class="splash-note">The lens engine is Python running in this page (Pyodide). The first start downloads it
      (about 15 MB); later starts come from the browser's cache.</p>
  </div>
</div>
<noscript><p style="padding:2em">LensForge needs JavaScript.</p></noscript>
</body>
</html>
